name: Deploy to VPS

# Gating on CI is via branch protection (required status checks: Backend
# CI, Frontend CI — see docs/06-devops-security-qa/03-vps-deployment.md),
# not a workflow_run dependency here: backend-ci.yml/frontend-ci.yml are
# each path-filtered, so a push touching only one side means the other
# workflow never runs at all — chaining on "both must complete" would
# deadlock. Branch protection gives the same guarantee (only reviewed,
# CI-passed commits reach main) without that risk.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Image tags must be lowercase, but the org name (OvasisGroup) isn't —
  # docker/build-push-action fails outright otherwise ("repository name
  # must be lowercase"). GitHub Actions expressions have no toLower()/
  # toUpper() string functions, so this is done in shell instead and
  # threaded through as a job output for the two build jobs to consume.
  vars:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - id: owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

  build-backend:
    runs-on: ubuntu-latest
    needs: vars
    env:
      BACKEND_IMAGE: ghcr.io/${{ needs.vars.outputs.owner }}/skillchain-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    needs: vars
    env:
      FRONTEND_IMAGE: ghcr.io/${{ needs.vars.outputs.owner }}/skillchain-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* vars are inlined at build time (see
          # frontend/Dockerfile) — repo VARIABLES, not secrets, since
          # they're all values a browser sees anyway.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      # Ships the whole infra/ tree fresh every run — deploy.sh, rollback.sh,
      # backup_postgres.sh, and docker-compose.prod.yml always match what's
      # actually in the repo at this commit. .env.prod and deploy.sh's state
      # files (.last_good_tag, .deploy_history) live outside this tree at
      # /opt/skillchain's root, so they're never touched by this step.
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "infra"
          target: "/opt/skillchain"
          strip_components: 0

      # IMAGE_TAG is inlined directly into the script rather than passed
      # through the action's `envs:` option, which needs mirroring at the
      # step's own `env:` level too and has been inconsistent across
      # appleboy/ssh-action versions.
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            chmod +x /opt/skillchain/infra/vps/*.sh
            cd /opt/skillchain
            IMAGE_TAG=${{ github.sha }} ./infra/vps/deploy.sh
