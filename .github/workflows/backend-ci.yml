name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/03-api/02-openapi.yaml"
      - ".spectral.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/03-api/02-openapi.yaml"
      - ".spectral.yaml"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    # mypy's django-stubs plugin imports Django settings to type-check against
    # the real model/field types, so it needs parseable (not live) env values.
    env:
      SECRET_KEY: lint-only
      DATABASE_URL: postgres://x:x@localhost/x
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: black --check .
      - run: mypy .
      # Fails on any drf-spectacular introspection error/warning (missing
      # serializer, unresolvable type, etc.) — this is what caught two real
      # bugs during M1 (LogoutView and MFAVerifyView had no inferrable
      # response schema).
      - run: python manage.py spectacular --fail-on-warn --file /dev/null
      # M12: docs/03-api/02-openapi.yaml is now reconciled 1:1 against the
      # live schema (see scripts/reconcile_openapi_spec.py) — a merge
      # blocker from here on, replacing the previous "docs are aspirational"
      # placeholder. Any new endpoint must be added to the spec in the same
      # PR, and vice versa.
      - run: python scripts/reconcile_openapi_spec.py
      # M12: lints docs/03-api/02-openapi.yaml itself (valid $refs, no
      # duplicate operationIds, well-formed schemas, ...) against
      # .spectral.yaml at the repo root — separate from the reconciliation
      # check above, which only compares the *route list*, not spec
      # validity. Fails only on real errors (spectral's default
      # --fail-severity=error); missing-description style warnings don't
      # block the merge.
      - name: Spectral lint OpenAPI spec
        working-directory: ${{ github.workspace }}
        run: npx --yes @stoplight/spectral-cli@6.16.2 lint docs/03-api/02-openapi.yaml

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillchain
          POSTGRES_USER: skillchain
          POSTGRES_PASSWORD: skillchain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-test-secret
      DATABASE_URL: postgres://skillchain:skillchain@localhost:5432/skillchain
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - run: python -m pytest

  dependency-scan:
    # M11: dependency scanning as an actual merge blocker, not advisory —
    # see docs/07-delivery-planning/02-backend-build-milestones.md M11.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - run: pip-audit

  secret-scan:
    # M11: secret scanning as an actual merge blocker. Scans full git
    # history (not just the working tree), since a secret committed and
    # later removed is still a leaked secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, dependency-scan, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: skillchain-backend:ci
