name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    # mypy's django-stubs plugin imports Django settings to type-check against
    # the real model/field types, so it needs parseable (not live) env values.
    env:
      SECRET_KEY: lint-only
      DATABASE_URL: postgres://x:x@localhost/x
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: black --check .
      - run: mypy .
      # Fails on any drf-spectacular introspection error/warning (missing
      # serializer, unresolvable type, etc.) — this is what caught two real
      # bugs during M1 (LogoutView and MFAVerifyView had no inferrable
      # response schema). Deliberately NOT diffed against the full
      # docs/03-api/02-openapi.yaml: that file is the aspirational
      # full-platform design (125 routes) written during planning, while
      # the codebase implements it incrementally milestone by milestone —
      # a literal diff would fail every PR until the entire API exists.
      # Docs are instead updated by hand alongside each milestone that adds
      # real endpoints (see commit history for M1's OAuth/MFA docs updates).
      - run: python manage.py spectacular --fail-on-warn --file /dev/null

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillchain
          POSTGRES_USER: skillchain
          POSTGRES_PASSWORD: skillchain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-test-secret
      DATABASE_URL: postgres://skillchain:skillchain@localhost:5432/skillchain
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - run: python -m pytest

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: skillchain-backend:ci
