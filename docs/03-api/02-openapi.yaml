components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
    Course:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        language: { type: string }
        difficulty: { type: string }
        rating: { type: number, format: float }
        price:
          type: object
          properties:
            amount: { type: string }
            currency: { type: string }
    CourseListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        next_cursor: { type: string, nullable: true }
    LiveSessionCreateRequest:
      type: object
      required: [conferencing_account_id, provider, title, scheduled_start_at, scheduled_end_at, timezone]
      properties:
        conferencing_account_id: { type: string }
        provider: { type: string, enum: [zoom, google_meet] }
        title: { type: string }
        description: { type: string }
        scheduled_start_at: { type: string, format: date-time }
        scheduled_end_at: { type: string, format: date-time }
        timezone: { type: string, description: 'IANA timezone, e.g. Africa/Nairobi' }
        capacity: { type: integer, nullable: true }
        is_recorded: { type: boolean, default: true }
    LiveSession:
      type: object
      properties:
        id: { type: string }
        course_id: { type: string, nullable: true }
        provider: { type: string, enum: [zoom, google_meet] }
        title: { type: string }
        status: { type: string, enum: [scheduled, live, ended, canceled] }
        scheduled_start_at: { type: string, format: date-time }
        scheduled_end_at: { type: string, format: date-time }
        timezone: { type: string }
        external_meeting_id: { type: string }
        host_join_url: { type: string }
