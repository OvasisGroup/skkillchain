      parameters:
        - in: path
          name: hackathonId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Hackathon published }
        '400': { description: Not in draft status }
  /organizer/hackathons/{hackathonId}/cancel:
    post:
      tags: [HackathonOrganizer]
