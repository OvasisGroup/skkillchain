  # ---------- Webhooks (inbound, provider-signed) ----------
  # NOTE: implemented as two generic, provider-parameterized routes rather
  # than one literal path per provider — see apps/commerce/views.py
  # ProviderWebhookView/MpesaWebhookView and apps/commerce/providers/
  # registry.py. Video/Zoom/Google-Meet webhooks were planned but never
  # built (conferencing integration in this codebase is OAuth-based —
  # connect/callback — not webhook-based); removed rather than
  # documenting endpoints that return 404.
  /webhooks/{provider}:
    post:
      tags: [Webhooks]
      summary: Payment provider event webhook
      security: []
      description: >-
        Signature-verified per provider (see each provider adapter's
        verify_and_parse_webhook). Events are deduplicated by
        (provider, provider_event_id) — a replayed event is acknowledged
        without reprocessing.
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [stripe, paypal, flutterwave, paystack] }
      responses:
        '200': { description: Event accepted (or already processed) }
        '404': { description: Unknown provider }
  /webhooks/mpesa/{secret}:
    post:
      tags: [Webhooks]
      summary: M-Pesa event webhook
      security: []
      description: >-
        M-Pesa's callback URL has no signature header, so the callback
        path itself carries a per-integration secret instead
        (X-Callback-Path-Secret).
      parameters:
        - in: path
          name: secret
          required: true
          schema: { type: string }
      responses:
        '200': { description: Event accepted (or already processed) }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    TokenResponse:
      type: object
      description: Matches SimpleJWT's own field names — access/refresh, not access_token/refresh_token.
      properties:
        access: { type: string }
        refresh: { type: string }
    MFALoginChallenge:
      type: object
      properties:
        mfa_required: { type: boolean, example: true }
        mfa_token:
          type: string
          description: Short-lived (5 min) signed token — pass to /auth/mfa/login-verify along with the TOTP code.
    MFAEnrollResponse:
      type: object
      properties:
        provisioning_uri:
          type: string
          description: otpauth:// URI — render as a QR code for the authenticator app.
        secret:
          type: string
          description: Same secret embedded in provisioning_uri, for manual entry.
    MFACodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 6 }
    MFALoginVerifyRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string }
        code: { type: string, minLength: 6, maxLength: 6 }
    Course:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        language: { type: string }
        difficulty: { type: string }
        rating: { type: number, format: float }
        price:
          type: object
          properties:
            amount: { type: string }
            currency: { type: string }
    CourseListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        next_cursor: { type: string, nullable: true }
    LiveSessionCreateRequest:
      type: object
      required: [conferencing_account_id, provider, title, scheduled_start_at, scheduled_end_at, timezone]
      properties:
        conferencing_account_id: { type: string }
        provider: { type: string, enum: [zoom, google_meet] }
        title: { type: string }
        description: { type: string }
        scheduled_start_at: { type: string, format: date-time }
        scheduled_end_at: { type: string, format: date-time }
        timezone: { type: string, description: 'IANA timezone, e.g. Africa/Nairobi' }
        capacity: { type: integer, nullable: true }
        is_recorded: { type: boolean, default: true }
    LiveSession:
      type: object
      properties:
        id: { type: string }
        course_id: { type: string, nullable: true }
        provider: { type: string, enum: [zoom, google_meet] }
        title: { type: string }
        status: { type: string, enum: [scheduled, live, ended, canceled] }
        scheduled_start_at: { type: string, format: date-time }
        scheduled_end_at: { type: string, format: date-time }
    HackathonCreateRequest:
      type: object
      required: [title, registration_deadline, submission_deadline, starts_at, ends_at]
      properties:
        title: { type: string }
        host_type: { type: string, enum: [internal, partner], default: internal }
        partner_name: { type: string, description: Required when host_type is 'partner'. }
        partner_url: { type: string }
        summary: { type: string }
        description: { type: string }
        requirements: { type: string, description: Eligibility, team, and submission requirements. }
        prize_summary: { type: string, example: "$10,000 in prizes" }
        registration_opens_at: { type: string, format: date-time, nullable: true }
        registration_deadline: { type: string, format: date-time }
        submission_deadline: { type: string, format: date-time }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        capacity: { type: integer, nullable: true }
    Hackathon:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        slug: { type: string }
        summary: { type: string }
        description: { type: string }
        host_type: { type: string, enum: [internal, partner] }
        partner_name: { type: string }
        requirements: { type: string }
        prize_summary: { type: string }
        registration_deadline: { type: string, format: date-time }
        submission_deadline: { type: string, format: date-time }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        capacity: { type: integer, nullable: true }
        registered_count: { type: integer }
        status: { type: string, enum: [draft, published, canceled] }
        phase:
          type: string
          enum: [draft, upcoming, active, completed, canceled]
          description: Derived from status + starts_at/ends_at at read time — not a stored column.
        winners:
          type: array
          items:
            type: object
            properties:
              placement: { type: integer }
              prize_description: { type: string }
              submission:
                type: object
                properties:
                  title: { type: string }
                  repo_url: { type: string }
                  demo_url: { type: string }
        timezone: { type: string }
        external_meeting_id: { type: string }
        host_join_url: { type: string }
