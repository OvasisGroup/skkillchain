    patch:
      tags: [Admin]
      summary: Update any hackathon regardless of organizer (requires hackathons.manage)
      parameters:
        - in: path
          name: hackathonId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Hackathon updated }
    put:
      tags: [Admin]
      summary: Replace any hackathon regardless of organizer (requires hackathons.manage)
      parameters:
        - in: path
          name: hackathonId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Hackathon updated }
  /admin/hackathons/{hackathonId}/registrations:
    get:
      tags: [Admin]
      summary: List registrants and submissions for any hackathon (requires hackathons.manage)
      parameters:
        - in: path
          name: hackathonId
          required: true
          schema: { type: string }
