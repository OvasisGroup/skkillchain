  # ---------- Hackathons ----------
  /hackathons:
    get:
      tags: [Hackathons]
      summary: Browse hackathons (active by default; upcoming/completed/all via ?scope=)
      security: []
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [active, upcoming, completed, all], default: active }
        - in: query
          name: host_type
          schema: { type: string, enum: [internal, partner] }
      responses:
        '200': { description: Hackathon list }
  /hackathons/{hackathonId}:
    get:
      tags: [Hackathons]
      summary: Get a hackathon's full detail, including its winners
      security: []
      parameters:
        - in: path
          name: hackathonId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Hackathon detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hackathon'
        '404': { description: "Draft hackathon (unless you're the organizer), or nonexistent" }
  /hackathons/{hackathonId}/register:
    post:
      tags: [Hackathons]
      summary: Register for a hackathon
      parameters:
        - in: path
          name: hackathonId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Registered }
        '200': { description: Already registered }
        '400': { description: 'Registration closed, or the hackathon is at capacity' }
    delete:
      tags: [Hackathons]
      summary: Withdraw a hackathon registration
      parameters:
        - in: path
          name: hackathonId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Withdrawn }
  /hackathons/{hackathonId}/submission:
    post:
      tags: [Hackathons]
      summary: Submit (or replace) a project for a hackathon the current user is registered for
      parameters:
        - in: path
          name: hackathonId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Submission created }
        '200': { description: Submission updated }
        '400': { description: The submission deadline has passed }
        '403': { description: Not registered for this hackathon }
  /students/me/hackathons:
    get:
      tags: [Hackathons]
      summary: List the current user's own hackathon registrations
      responses:
        '200': { description: Registration list }
  /organizer/hackathons:
    get:
      tags: [HackathonOrganizer]
      summary: List hackathons the current user organizes
      responses:
        '200': { description: Hackathon list }
    post:
      tags: [HackathonOrganizer]
      summary: Create a hackathon, internally hosted or in partnership with another organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HackathonCreateRequest'
      responses:
        '201':
          description: Hackathon created (starts as a draft — call publish to make it visible)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hackathon'
  /organizer/hackathons/{hackathonId}:
    get:
      tags: [HackathonOrganizer]
      summary: Get a hackathon the current user organizes
      parameters:
        - in: path
          name: hackathonId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Hackathon detail }
    patch:
      tags: [HackathonOrganizer]
      summary: Update a hackathon the current user organizes
      parameters:
        - in: path
          name: hackathonId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Hackathon updated }
    put:
      tags: [HackathonOrganizer]
      summary: Replace a hackathon the current user organizes
      parameters:
        - in: path
          name: hackathonId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Hackathon updated }
  /organizer/hackathons/{hackathonId}/publish:
    post:
