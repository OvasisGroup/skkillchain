    post:
      tags: [Payments]
      summary: Apply a gift card balance to an order
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                amount: { type: string, description: Optional partial amount to apply }
      responses:
        '200': { description: 'Gift card applied, order totals recalculated' }
  /checkout/orders/{orderId}/pay:
    post:
      tags: [Payments]
