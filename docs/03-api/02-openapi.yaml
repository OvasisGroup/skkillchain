openapi: 3.1.0
info:
  title: SkillChain Learning Platform API
  version: 1.0.0
  description: Enterprise learning platform REST API
servers:
  - url: https://api.skillchain.com/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Courses
  - name: Instructor
  - name: Student
  - name: LiveSessions
  - name: Hackathons
  - name: HackathonOrganizer
  - name: Assessments
  - name: Payments
  - name: Messaging
  - name: Reviews
  - name: Admin
  - name: Analytics
  - name: AI
  - name: Webhooks
  - name: Certificates
  - name: Progress
  - name: Notifications
  - name: Affiliate
  - name: Privacy
  - name: Support
paths:
  # ---------- Authentication ----------
  /auth/register:
    post:
      tags: [Auth]
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      tags: [Auth]
      summary: Login with credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated — no MFA factor confirmed on this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '202':
          description: Password correct, MFA required — complete with POST /auth/mfa/login-verify
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFALoginChallenge'
        '401': { description: Invalid credentials }
        '429': { description: Rate limited (10/min per IP) }
  /auth/token/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      responses:
        '200': { description: Token refreshed }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke refresh token / end session
      responses:
        '204': { description: Logged out }
  /auth/mfa/enroll:
    post:
      tags: [Auth]
      summary: Start TOTP enrollment for the current user
      responses:
        '201':
          description: Pending factor created — client renders provisioning_uri as a QR code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAEnrollResponse'
  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Confirm a pending TOTP enrollment with a code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFACodeRequest'
      responses:
        '200': { description: Factor confirmed }
        '401': { description: Incorrect code }
        '404': { description: No pending enrollment — call /auth/mfa/enroll first }
  /auth/mfa/login-verify:
    post:
      tags: [Auth]
      summary: Complete a login that returned mfa_required — exchanges mfa_token + code for real tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFALoginVerifyRequest'
      responses:
        '200':
          description: MFA verified — login complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': { description: 'Incorrect code, or mfa_token expired/invalid' }
  /auth/oauth/{provider}/token:
    post:
      tags: [Auth]
      summary: >-
        Exchange a provider-issued token for platform JWTs. The client performs the OAuth
        flow with the provider's own SDK (Google Sign-In, Sign in with Apple, Facebook Login)
        and sends the resulting token here for verification — see
        docs/04-platform-structure/02-core-flows.md §8 for why this platform uses a
        token-exchange pattern rather than a server-driven redirect flow.
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [google, apple, facebook] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: ID token (Google/Apple) or access token (Facebook)
      responses:
        '200':
          description: Verified — logged in (existing identity/account) or registered (new account)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': { description: 'Token failed provider verification, or would link an unverified email to an existing account' }
        '404': { description: Unknown provider }
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      responses:
        '200': { description: Current user }
    patch:
      tags: [Auth]
      summary: Update current user profile
      responses:
        '200': { description: Profile updated }
    put:
      tags: [Auth]
      summary: Replace current user profile
      responses:
        '200': { description: Profile updated }
  /auth/me/avatar:
    post:
      tags: [Auth]
      summary: Upload or replace the current user's avatar image (multipart/form-data)
      responses:
        '200': { description: Avatar updated }

  # ---------- Course Catalog ----------
  /courses:
    get:
      tags: [Courses]
      summary: List courses
      security: []
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: language
          schema: { type: string }
        - in: query
          name: difficulty
          schema: { type: string, enum: [beginner, intermediate, advanced] }
      responses:
        '200':
          description: Course list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
  /courses/{courseId}:
    get:
      tags: [Courses]
      summary: Get course details
      security: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Course details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
  /courses/{courseId}/preview:
    get:
      tags: [Courses]
      summary: Get free preview content for a course
      security: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Preview lessons/videos }
  /categories:
    get:
      tags: [Courses]
      summary: List categories
      security: []
      responses:
        '200': { description: Category list }
    post:
      tags: [Admin]
      summary: Create a category (requires categories.manage)
      responses:
        '201': { description: Category created }
        '403': { description: Missing categories.manage permission }
  /categories/{categoryId}:
    get:
      tags: [Courses]
      summary: Get a single category
      security: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Category detail }
    patch:
      tags: [Admin]
      summary: Update a category (requires categories.manage)
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Category updated }
    put:
      tags: [Admin]
      summary: Replace a category (requires categories.manage)
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Category updated }
    delete:
      tags: [Admin]
      summary: Delete a category (requires categories.manage)
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Category deleted }
        '400': { description: Category is still assigned to one or more courses }
  /tags:
    get:
      tags: [Courses]
      summary: List tags
      security: []
      responses:
        '200': { description: Tag list }
    post:
      tags: [Courses]
      summary: Create a tag, or return the existing one with a matching name (case-insensitive)
      responses:
        '200': { description: Existing tag with this name returned }
        '201': { description: Tag created }
  /tags/{tagId}:
    get:
      tags: [Courses]
      summary: Get a single tag
      security: []
      parameters:
        - in: path
          name: tagId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Tag detail }
    patch:
      tags: [Admin]
      summary: Update a tag (requires tags.manage)
      parameters:
        - in: path
          name: tagId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Tag updated }
    put:
      tags: [Admin]
      summary: Replace a tag (requires tags.manage)
      parameters:
        - in: path
          name: tagId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Tag updated }
    delete:
      tags: [Admin]
      summary: Delete a tag (requires tags.manage)
      parameters:
        - in: path
          name: tagId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Tag deleted }
  /instructors:
    get:
      tags: [Courses]
      summary: List every instructor with at least one published course
      security: []
      responses:
        '200': { description: Instructor list }
  /instructors/{instructorId}:
    get:
      tags: [Courses]
      summary: Get an instructor's public profile and their published courses
      security: []
      parameters:
        - in: path
          name: instructorId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Instructor detail }
        '404': { description: "No such instructor, or they have no published courses" }
  # NOTE: a dedicated faceted /search/courses endpoint (text/rating/price
  # filters, sort_by) was planned but never built — GET /courses only
  # supports category/language/difficulty filters. GET /ai/search below is
  # the AI-powered semantic search that was built instead. Removed from
  # this frozen spec rather than documenting an endpoint that returns 404.

  # ---------- Instructor Content Management ----------
  /instructor/courses:
    get:
      tags: [Instructor]
      summary: List the current instructor's own courses
      responses:
        '200': { description: Course list }
    post:
      tags: [Instructor]
      summary: Create course
      responses:
        '201': { description: Course created }
  /instructor/courses/{courseId}:
    get:
      tags: [Instructor]
      summary: Get one of the current instructor's own courses
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Course detail }
    patch:
      tags: [Instructor]
      summary: Update a draft, rejected, or published course (notifies enrolled students if published)
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Course updated }
    put:
      tags: [Instructor]
      summary: Replace a draft, rejected, or published course (notifies enrolled students if published)
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Course updated }
  /instructor/courses/{courseId}/submit-review:
    post:
      tags: [Instructor]
      summary: Submit course for content review
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Submitted for review }
  /instructor/courses/{courseId}/publish:
    post:
      tags: [Instructor]
      summary: Publish an approved course
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Course published }
  /instructor/courses/{courseId}/sections:
    get:
      tags: [Instructor]
      summary: List sections for one of the current instructor's own courses
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Section list }
    post:
      tags: [Instructor]
      summary: Create a course section
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Section created }
  /instructor/sections/{sectionId}/lessons:
    get:
      tags: [Instructor]
      summary: List lessons within a section owned by the current instructor
      parameters:
        - in: path
          name: sectionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lesson list }
    post:
      tags: [Instructor]
      summary: Create a lesson within a section
      parameters:
        - in: path
          name: sectionId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Lesson created }
  /instructor/lessons/{lessonId}:
    get:
      tags: [Instructor]
      summary: Get a lesson within a course the current instructor owns
      parameters:
        - in: path
          name: lessonId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lesson detail }
    patch:
      tags: [Instructor]
      summary: Update a lesson, including attaching/replacing its content_file (video/PDF) — only while the course is draft or rejected
      parameters:
        - in: path
          name: lessonId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lesson updated }
    put:
      tags: [Instructor]
      summary: Replace a lesson — only while the course is draft or rejected
      parameters:
        - in: path
          name: lessonId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lesson updated }
  # NOTE: direct-to-provider video upload-init and lesson-resource-attach
  # endpoints were planned but never built — Lesson's own docstring
  # (apps/content/models.py) says video provider/playback metadata is a
  # deferred follow-up. Removed rather than documenting endpoints that
  # return 404.
  /instructor/courses/{courseId}/quizzes:
    post:
      tags: [Instructor]
      summary: Create a quiz for a course
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Quiz created }
  /instructor/courses/{courseId}/assignments:
    get:
      tags: [Instructor]
      summary: List assignments for a course the current instructor owns
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Assignment list }
    post:
      tags: [Instructor]
      summary: Create an assignment for a course
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Assignment created }
  /instructor/courses/{courseId}/students:
    get:
      tags: [Instructor]
      summary: List every student enrolled in a course the current user teaches, with aggregate progress
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Student roster with progress }
  /instructor/courses/{courseId}/coupons:
    post:
      tags: [Instructor]
      summary: Create a course-scoped coupon
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Coupon created }
  /instructor/courses/{courseId}/coding-exercises:
    post:
      tags: [Instructor]
      summary: Create a coding exercise within a course
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Coding exercise created }
  /instructor/assignments/{assignmentId}/submissions:
    get:
      tags: [Instructor]
      summary: List submissions for an assignment the instructor owns
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Submission list }
  /instructor/assignments/{assignmentId}/submissions/{submissionId}/grade:
    post:
      tags: [Instructor]
      summary: Grade an assignment submission (or approve/edit an AI-suggested grade)
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string }
        - in: path
          name: submissionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Submission graded }
  /assignments/submissions/{submissionId}/approve-ai-grade:
    post:
      tags: [Instructor]
      summary: Approve an AI-suggested grade as-is, without instructor edits
      parameters:
        - in: path
          name: submissionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: AI-suggested grade approved }
  # NOTE: standalone /instructor/dashboard/revenue and
  # /instructor/dashboard/analytics endpoints were planned but never
  # built — GET /analytics/instructor-earnings (see Analytics section)
  # and GET /instructor/wallet below cover the same data. Removed rather
  # than documenting endpoints that return 404.
  /instructor/wallet:
    get:
      tags: [Instructor]
      summary: Get the current instructor's wallet balance
      responses:
        '200': { description: Wallet balance }
  /instructor/payouts:
    get:
      tags: [Instructor]
      summary: List the current instructor's past payouts
      responses:
        '200': { description: Payout list }
  /instructor/payout-requests:
    post:
      tags: [Instructor]
      summary: Request a payout of available balance
      responses:
        '201': { description: Payout request created }
  /instructor/apply:
    post:
      tags: [Instructor]
      summary: Apply to become an instructor
      responses:
        '201': { description: Instructor application created }

  # ---------- Student Learning ----------
  /enrollments:
    post:
      tags: [Student]
      summary: Enroll in a course
      responses:
        '201': { description: Enrolled }
  /courses/{courseId}/curriculum:
    get:
      tags: [Student]
      summary: Get the section/lesson structure for a course the current user is enrolled in (no lesson content, just the curriculum sidebar)
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Curriculum sections with lessons }
  /lessons/{lessonId}/content:
    get:
      tags: [Student]
      summary: Get a lesson's playable/viewable content (video or PDF file URL) for a course the current user is enrolled in
      parameters:
        - in: path
          name: lessonId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lesson content }
  /students/me/courses:
    get:
      tags: [Student]
      summary: List purchased/enrolled courses
      responses:
        '200': { description: Enrolled course list }
  /students/me/continue-learning:
    get:
      tags: [Student]
      summary: Continue-learning feed
      responses:
        '200': { description: In-progress course list }
  /students/me/wishlist:
    get:
      tags: [Student]
      summary: List wishlist items
      responses:
        '200': { description: Wishlist }
  /students/me/wishlist/{courseId}:
    post:
      tags: [Student]
      summary: Add course to wishlist
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Added to wishlist }
    delete:
      tags: [Student]
      summary: Remove course from wishlist
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed from wishlist }
  /progress:
    post:
      tags: [Progress]
      summary: Update lesson progress
      responses:
        '200': { description: Updated }
  /progress/{enrollmentId}:
    get:
      tags: [Progress]
      summary: Get progress for an enrollment
      parameters:
        - in: path
          name: enrollmentId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Progress detail }
  /lesson-notes:
    post:
      tags: [Student]
      summary: Create a timestamped lesson note
      responses:
        '201': { description: Note created }
  /bookmarks:
    post:
      tags: [Student]
      summary: Create a lesson bookmark
      responses:
        '201': { description: Bookmark created }
  /certificates:
    get:
      tags: [Certificates]
      summary: List certificates earned by the current user
      responses:
        '200': { description: Certificate list }
  /certificates/{certificateUid}/verify:
    get:
      tags: [Certificates]
      summary: Verify certificate
      security: []
      parameters:
        - in: path
          name: certificateUid
          required: true
          schema: { type: string }
      responses:
        '200': { description: Certificate verification result }

  # ---------- Live Sessions ----------
  /instructor/conferencing-accounts/{provider}/connect:
    post:
      tags: [LiveSessions]
      summary: Start OAuth connect flow for an instructor's Zoom or Google account
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [zoom, google_meet] }
      responses:
        '200': { description: OAuth authorization URL issued }
  /instructor/conferencing-accounts/{provider}/callback:
    get:
      tags: [LiveSessions]
      summary: OAuth callback completing the conferencing account connect flow
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [zoom, google_meet] }
      responses:
        '200': { description: Account connected }
  /instructor/conferencing-accounts:
    get:
      tags: [LiveSessions]
      summary: List connected conferencing accounts
      responses:
        '200': { description: Connected account list }
  /instructor/conferencing-accounts/{accountId}:
    delete:
      tags: [LiveSessions]
      summary: Disconnect a conferencing account and revoke tokens
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Disconnected }
  /instructor/courses/{courseId}/live-sessions:
    post:
      tags: [LiveSessions]
      summary: Schedule a live session for a course (creates the remote meeting via provider adapter)
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveSessionCreateRequest'
      responses:
        '201':
          description: Live session scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSession'
  /instructor/live-sessions/{liveSessionId}:
    patch:
      tags: [LiveSessions]
      summary: Reschedule or update a live session
      parameters:
        - in: path
          name: liveSessionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Live session updated }
  /instructor/live-sessions/{liveSessionId}/cancel:
    post:
      tags: [LiveSessions]
      summary: Cancel a live session and notify registrants
      parameters:
        - in: path
          name: liveSessionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Live session canceled }
  /instructor/live-sessions/{liveSessionId}/registrations:
    get:
      tags: [LiveSessions]
      summary: List registrants and attendance for a live session
      parameters:
        - in: path
          name: liveSessionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Registration list }
  /courses/{courseId}/live-sessions:
    get:
      tags: [LiveSessions]
      summary: List upcoming and past live sessions for a course
      security: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Live session list }
  /students/me/live-sessions:
    get:
      tags: [LiveSessions]
      summary: List the current user's registered live sessions
      responses:
        '200': { description: Live session list }
  /live-sessions/{liveSessionId}/register:
    post:
      tags: [LiveSessions]
      summary: Register for a live session (requires course enrollment)
      parameters:
        - in: path
          name: liveSessionId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Registered }
    delete:
      tags: [LiveSessions]
      summary: Cancel a live session registration
      parameters:
        - in: path
          name: liveSessionId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Registration canceled }
  /live-sessions/{liveSessionId}/join:
    get:
      tags: [LiveSessions]
      summary: Get the join URL (only issued to registered students within the join window)
      parameters:
        - in: path
          name: liveSessionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Join URL }
