[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skillchain-backend"
version = "0.1.0"
description = "SkillChain learning platform backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "django-environ>=0.11,<0.12",
    "psycopg[binary]>=3.2,<3.3",
    "django-redis>=5.4,<5.5",
    "celery>=5.4,<5.5",
    "gunicorn>=23.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<0.7",
    "black>=24.8,<25.0",
    "mypy>=1.11,<1.12",
    "django-stubs>=5.0,<5.1",
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<4.10",
    "pytest-cov>=5.0,<6.0",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps", "shared"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--cov=apps --cov=shared --cov-report=term-missing"
