[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skillchain-backend"
version = "0.1.0"
description = "SkillChain learning platform backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "django-environ>=0.11,<0.12",
    "psycopg[binary]>=3.2,<3.3",
    "django-redis>=5.4,<5.5",
    "celery>=5.4,<5.5",
    "djangorestframework>=3.15,<3.16",
    # >=5.5 for PYSEC-2026-1305 (see docs/06-devops-security-qa — M11
    # dependency-scanning pass; pip-audit flagged 5.3.1).
    "djangorestframework-simplejwt>=5.5,<5.6",
    "drf-spectacular>=0.27,<0.28",
    "argon2-cffi>=23.1,<24.0",
    "google-auth>=2.34,<2.35",
    # >=2.13 for several PyJWT CVEs pip-audit flagged against 2.9.0
    # (PYSEC-2026-120/175/176/177/178/179, PYSEC-2025-183).
    "PyJWT[crypto]>=2.13,<3.0",
    # >=2.33 for PYSEC-2026-2275 (pip-audit flagged 2.32.5).
    "requests>=2.33,<2.34",
    "pyotp>=2.9,<2.10",
    "django-cors-headers>=4.4,<4.5",
    "channels>=4.1,<4.2",
    "channels-redis>=4.2,<4.3",
    # >=4.2 for PYSEC-2026-213/214 (pip-audit flagged 4.1.2).
    "daphne>=4.2,<4.3",
    # Pinned explicitly: autobahn (a daphne/channels dependency) requires
    # cbor2, and newer cbor2 releases ship without a prebuilt wheel for
    # some platforms, forcing a Rust build that isn't guaranteed to
    # succeed everywhere this installs. 5.9.0 has a universal wheel.
    "cbor2==5.9.0",
    "anthropic>=0.40,<0.50",
    # Already pulled in transitively by drf-spectacular; pinned explicitly
    # because scripts/reconcile_openapi_spec.py imports it directly.
    "PyYAML>=6.0,<7.0",
    # Certificate PDF rendering (apps/learning/certificates.py).
    "reportlab>=4.2,<5.0",
    "qrcode[pil]>=7.4,<8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<0.7",
    # >=26.3 for PYSEC-2026-2120/2121 (pip-audit flagged 24.10.0). Dev-only
    # tool (never ships to prod), but the fix was cheap: a 30-file
    # `black .` reformat with no behavior change.
    "black>=26.3,<27.0",
    "mypy>=1.11,<1.12",
    "django-stubs>=5.2,<5.3",
    # >=9.0 for PYSEC-2026-1845 (pip-audit flagged 8.4.2).
    "pytest>=9.0,<10.0",
    "pytest-django>=4.9,<5.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=5.0,<8.0",
    "types-requests>=2.32,<2.33",
    "pip-audit>=2.7,<3.0",
    "schemathesis>=4.24,<5.0",
    "locust>=2.46,<3.0",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps", "shared"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--cov=apps --cov=shared --cov-report=term-missing"
asyncio_mode = "auto"
