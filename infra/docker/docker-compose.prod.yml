# Production compose file for a single VPS. Contrast with docker-compose.yml
# (dev): images are pre-built and pulled from GHCR (not built here), no host
# ports are published except the two host-nginx needs to reach (api, frontend
# — both bound to loopback only), and postgres/redis/rabbitmq get no
# published ports at all since only other containers on this compose network
# ever need to reach them.
#
# Usage (see infra/vps/deploy.sh, which drives this — you shouldn't normally
# need to run these by hand):
#   docker compose --env-file .env.prod --env-file .env.deploy \
#     -f docker-compose.prod.yml pull
#   docker compose --env-file .env.prod --env-file .env.deploy \
#     -f docker-compose.prod.yml up -d --remove-orphans
#
# --env-file only controls ${...} interpolation *within this file* (e.g.
# ${IMAGE_TAG} below) — it does NOT inject those variables into a container's
# runtime environment. Each app service therefore also declares its own
# `env_file: .env.prod` so Django actually receives SECRET_KEY, DATABASE_URL,
# etc. inside the container.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    image: ghcr.io/ovasisgroup/skillchain-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.prod
    # Loopback-only — the one port host-nginx (installed directly on the
    # VPS, not in this compose network) needs to reach. Never published to
    # 0.0.0.0; nothing outside this box should talk to Daphne directly.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: ghcr.io/ovasisgroup/skillchain-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file:
      - .env.prod
    volumes:
      - media_data:/app/media
    # Overrides the image's inherited HEALTHCHECK (backend/Dockerfile's
    # curl against :8000/healthz/live/) — this container runs a Celery
    # worker, not Daphne, so nothing ever listens on 8000 here. Without
    # this override, `docker compose up --wait` (used by infra/vps/
    # deploy.sh) would wait forever for a healthcheck that can never pass
    # and fail every single deploy. `inspect ping` confirms the worker
    # actually connected to the broker, not just that the process exists.
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  beat:
    image: ghcr.io/ovasisgroup/skillchain-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    env_file:
      - .env.prod
    # Same reason as worker's override above — beat has no equivalent
    # "ping" (it schedules, it doesn't consume tasks), so this falls back
    # to Compose treating "container is running" as healthy rather than
    # inheriting a check that can never succeed.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    image: ghcr.io/ovasisgroup/skillchain-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # NEXT_PUBLIC_* vars are already baked into this image at build time
    # (see frontend/Dockerfile) and don't come from here. This env_file is
    # only for API_BASE_URL_INTERNAL — a plain runtime var (not NEXT_PUBLIC_,
    # so never inlined into the client bundle) that lets the Next.js
    # server's own fetches (Server Components, SSR) reach the api container
    # directly over this network instead of round-tripping through the
    # public domain and host nginx.
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  # Bind-mounted from the host (see .env.prod.example's MEDIA_HOST_DIR /
  # STATIC_HOST_DIR) rather than plain named volumes, specifically so
  # host-installed nginx can serve /static/ and /media/ directly via
  # `alias` without reaching into Docker's internal volume storage path.
  media_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_HOST_DIR}
  static_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STATIC_HOST_DIR}
