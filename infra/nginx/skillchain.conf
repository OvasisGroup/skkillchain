# Phase 2 (final) nginx config — install this AFTER http-bootstrap.conf has
# already obtained a certificate (see docs/06-devops-security-qa/
# 03-vps-deployment.md). Installed once, manually, during initial VPS setup;
# ongoing GitHub Actions deploys never touch this file — only the app
# containers behind it.
#
# Replace api.yourdomain.com / app.yourdomain.com below with your real
# domains (must match what you ran `certbot certonly -d ... -d ...` with).
#
# Install as /etc/nginx/sites-available/skillchain (replacing
# http-bootstrap.conf's symlink), then: sudo nginx -t && sudo systemctl
# reload nginx

# Kept on port 80 for two reasons: redirecting everything else to HTTPS, and
# keeping the acme-challenge webroot reachable so certbot's renewal timer
# (systemd, installed automatically with the certbot package) keeps working
# without ever needing to touch this file again.
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com app.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 folded into `listen` (not the standalone `http2 on;` directive)
    # because provision.sh installs nginx via apt, which on Ubuntu 24.04 is
    # 1.24.0 — older than 1.25.1, where that directive was introduced.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Course video/PDF uploads — Django's DATA_UPLOAD_MAX_MEMORY_SIZE only
    # controls in-memory buffering before spooling to disk, not a hard
    # limit; nginx is the actual gate on request size.
    client_max_body_size 1024m;
    client_body_timeout 300s;

    # Set at server level (not per-location) — config/settings/prod.py has
    # SECURE_SSL_REDIRECT=True and SECURE_PROXY_SSL_HEADER checking this
    # header. Missing it on ANY proxied path here means Django thinks that
    # request arrived over plain HTTP and redirects to https://, which
    # nginx then proxies again just as "insecurely" — an infinite redirect
    # loop, not just a cosmetic issue.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Websocket routes (messaging/notifications/reviews — see
    # backend/apps/*/routing.py, all mounted under ^ws/). Separate location
    # because the default 60s proxy_read_timeout would silently kill an
    # idle-but-open chat/notification socket.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Served directly by nginx from the host bind-mount (see
    # docker-compose.prod.yml's media_data/static_data volumes and
    # .env.prod.example's MEDIA_HOST_DIR/STATIC_HOST_DIR) rather than
    # proxied through Daphne — matches STATIC_URL/MEDIA_URL in
    # config/settings/base.py.
    location /static/ {
        alias /opt/skillchain/data/static/;
        add_header X-Content-Type-Options nosniff always;
    }

    # Defense-in-depth on top of apps/content/models.py's upload extension
    # allowlist: if a script-capable file (html/svg/js) ever ends up under
    # /media/ by any other path, force it to download rather than render/
    # execute in the browser on this origin. A regex location always takes
    # precedence over a plain-prefix one like /media/ below regardless of
    # declaration order, so this only intercepts these specific extensions
    # — image/video/pdf uploads (the only types upload endpoints accept)
    # fall through to the plain /media/ block untouched.
    location ~* ^/media/.+\.(?:html?|svg|js|mjs)$ {
        root /opt/skillchain/data;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition "attachment" always;
    }

    location /media/ {
        alias /opt/skillchain/data/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.yourdomain.com;

    # Same cert (one SAN cert covers both names — see the certbot command
    # in the runbook).
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Next.js dev-mode HMR isn't in play in production, but standard
        # upgrade headers are harmless to keep here and cost nothing.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
