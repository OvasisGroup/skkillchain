# Phase 1 of the certbot bootstrap (see docs/06-devops-security-qa/
# 03-vps-deployment.md's "One-time VPS setup" section) — HTTP-only, just
# enough to let `certbot certonly --webroot` prove domain ownership before
# any certificate exists.
#
# Do NOT skip straight to installing skillchain.conf on a fresh box: it
# references cert files under /etc/letsencrypt/live/ that don't exist yet,
# and nginx will refuse to start/reload. Install *this* file first, obtain
# the cert, then replace it with skillchain.conf (a one-time, manual swap —
# ongoing deploys never touch nginx config at all).
#
# Install as /etc/nginx/sites-available/skillchain, symlink into
# sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com app.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "SkillChain: nginx is up, certificate not issued yet.\n";
        add_header Content-Type text/plain;
    }
}
